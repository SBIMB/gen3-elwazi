$schema: "http://json-schema.org/draft-04/schema#"
id: "NCD_lifestyle_exposure"
title: "NCD Lifestyle and Exposure"
type: "object"
category: "clinical"
program: "*"
project: "*"
description: "Self-reported lifestyle risk factors, behavioral exposures, diet, and physical activity."
additionalProperties: false
submittable: true
validators: null

links:
  - name: subjects
    backref: NCD_lifestyle_exposures
    label: describes
    target_type: "subject"
    multiplicity: "many_to_one"
    required: true

required:
  - submitter_id
  - type
  - subjects

systemProperties:
  - id 
  - project_id
  - state
  - created_datetime
  - updated_datetime


$schema: "http://json-schema.org/draft-04/schema#"
id: "medical_history"
title: "Medical History"
type: "object"
category: "clinical"
program: "*"
project: "*"
description: "Self-reported medical history, diagnoses, family history, and current treatments for non-communicable diseases (NCDs)."
additionalProperties: false
submittable: true

links:
  - name: subjects
    backref: medical_histories
    label: describes
    target_type: "subject"
    multiplicity: "many_to_one"
    required: true

required:
  - submitter_id
  - type
  - subjects

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"
  
  submitter_id:
    type: "string"

  obs_date:
    type: "string"
    format: "date"
    description: "Date of interview / Observation date"

  contracep:
    description: "Use of contraception"
    enum:
      - "0-no"  
      - "1-yes"
      - "333-don't know"
      - "444-refused"
      - "888-not applicable"
      - "999-missing"

  preg_num_cat:
    description: "Number of pregnancies"
    enum:
      - "0-none"
      - "1-one"
      - "2-two"
      - "3-three"
      - "4-more than three"
      - "888-Not Applicable"

  births:
    description: "Number of live births"
    anyOf:
      - type: "number"
        minimum: 0 
      - type: "integer"
        enum: [-333, -444, -888, -999]

  bp_measured_ever:
    description: "Have you ever had your blood pressure measured by a doctor, nurse or other health worker?"
    enum:
      - "0-no"  
      - "1-yes"
      - "333-don't know"
      - "444-refused"
      - "888-not applicable"

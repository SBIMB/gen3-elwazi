apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: 
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: default
    sectionName: web
  hostnames:
  - "grafana.gen3.local"
  rules:
    - backendRefs:
      - name: monitoring-grafana
        port: 80

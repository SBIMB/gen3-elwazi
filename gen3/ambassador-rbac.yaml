apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ambassador
rules:
- apiGroups: [""]
  resources: ["services", "nodes", "endpoints", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["getambassador.io"]
  resources: ["mappings", "modules", "tlsconfigs", "hosts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.x-k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ambassador
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ambassador
subjects:
- kind: ServiceAccount
  name: ambassador
  namespace: default

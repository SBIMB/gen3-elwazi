etl:
  etlMapping:
    mappings:
      - name: subject
        doc_type: subject
        type: aggregator
        root: subject
        props:
          - name: submitter_id
          - name: project_id
          - name: auth_resource_path
          - name: hdss_name
          - name: dob
        flatten_props:
          - path: demographic
            props:
              - name: sex
                src: sex
              - name: ethnicity
                src: ethnicity
              - name: home_language
                src: home_language
        aggregated_props:
          - name: _demographic_count
            path: demographic
            fn: count
          - name: _ncd_lab_count
            path: NCD_labs
            fn: count
          - name: _ncd_vital_count
            path: NCD_vitals
            fn: count

          # Vitals categories
          - name: bp_sys
            path: NCD_vitals
            src: bp_sys
            fn: max
          - name: bmi
            path: NCD_vitals
            src: bmi
            fn: max
          - name: pulse
            path: NCD_vitals
            src: pulse
            fn: max
          - name: health_rating
            path: NCD_vitals
            src: health_rating
            fn: set

          # Labs
          - name: hiv_test_result
            path: NCD_labs
            src: hiv_test_result
            fn: set
          - name: bg_mmol_fst
            path: NCD_labs
            src: bg_mmol_fst
            fn: max
          - name: hdl_mmol
            path: NCD_labs
            src: hdl_mmol
            fn: max
          - name: ldl_mmol
            path: NCD_labs
            src: ldl_mmol
            fn: max
          - name: insulin_fasting
            path: NCD_labs
            src: insulin_fasting
            fn: max
          - name: urine_sg
            path: NCD_labs
            src: urine_sg
            fn: set
          - name: urine_ph
            path: NCD_labs
            src: urine_ph
            fn: set
          - name: urine_leuk
            path: NCD_labs
            src: urine_leuk
            fn: set
          - name: urine_nit
            path: NCD_labs
            src: urine_nit
            fn: set
          - name: urine_pro
            path: NCD_labs
            src: urine_pro
            fn: set
          - name: urine_ket
            path: NCD_labs
            src: urine_ket
            fn: set
          - name: urine_uro
            path: NCD_labs
            src: urine_uro
            fn: set
          - name: urine_ery
            path: NCD_labs
            src: urine_ery
            fn: set
          - name: pi_acr
            path: NCD_labs
            src: pi_acr
            fn: max

          # Lifestyle and Exposure
          - name: actv_sleeping_hrs
            path: NCD_lifestyle_exposures
            src: actv_sleeping_hrs
            fn: max
          - name: alco_freq
            path: NCD_lifestyle_exposures
            src: alco_freq
            fn: set
  

etl:
  etlMapping:
    mappings:
      - name: subject
        doc_type: subject
        type: aggregator
        root: subject
        props:
          - name: submitter_id
          - name: project_id
          - name: auth_resource_path
          - name: hdss_name
          - name: dob
          # --- New Subject Variables ---
          - name: dod
          - name: date_into_dsa
          - name: date_out_of_dsa
          - name: mother_id
          - name: father_id
        flatten_props:
          - path: demographic
            props:
              - name: sex
                src: sex
              - name: ethnicity
                src: ethnicity
              - name: home_language
                src: home_language
        aggregated_props:
          - name: _demographic_count
            path: demographic
            fn: count
          - name: _ncd_lab_count
            path: NCD_labs
            fn: count
          - name: _ncd_vital_count
            path: NCD_vitals
            fn: count
          - name: _ncd_lifestyle_count
            path: NCD_lifestyle_exposures
            fn: count
          - name: _medical_history_count
            path: medical_histories
            fn: count

          # --- Vitals Categories ---
          - name: bp_sys
            path: NCD_vitals
            src: bp_sys
            fn: max
          - name: bmi
            path: NCD_vitals
            src: bmi
            fn: max
          - name: pulse
            path: NCD_vitals
            src: pulse
            fn: max
          - name: health_rating
            path: NCD_vitals
            src: health_rating
            fn: set
          # New Vitals Additions
          - name: bp_dia
            path: NCD_vitals
            src: bp_dia
            fn: max
          - name: preg
            path: NCD_vitals
            src: preg
            fn: set

          # --- Lifestyle and Exposure ---
          - name: actv_sleeping_hrs
            path: NCD_lifestyle_exposures
            src: actv_sleeping_hrs
            fn: max
          - name: alco_freq
            path: NCD_lifestyle_exposures
            src: alco_freq
            fn: set
          # New Lifestyle Additions
          - name: tobac_ever
            path: NCD_lifestyle_exposures
            src: tobac_ever
            fn: set
          - name: tobac_cur
            path: NCD_lifestyle_exposures
            src: tobac_cur
            fn: set
          - name: alco_ever
            path: NCD_lifestyle_exposures
            src: alco_ever
            fn: set
          - name: alco_cur
            path: NCD_lifestyle_exposures
            src: alco_cur
            fn: set
          - name: alco_type
            path: NCD_lifestyle_exposures
            src: alco_type
            fn: set
          - name: drug_ever
            path: NCD_lifestyle_exposures
            src: drug_ever
            fn: set
          - name: actv_vigorous_sports
            path: NCD_lifestyle_exposures
            src: actv_vigorous_sports
            fn: set
          - name: actv_mvpa
            path: NCD_lifestyle_exposures
            src: actv_mvpa
            fn: max
          
          # --- Labs (No changes needed, already >10) ---
